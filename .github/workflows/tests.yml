name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # No model weights, GPU or network access are needed by the suite: it uses a synthetic
    # collection, a fake text encoder, fake LLM clients and a mock DRES server. The headless-browser
    # UI tests are skipped here (VBS_SKIP_UI=1).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ingest,test]"
      - name: Test
        env:
          VBS_SKIP_UI: "1"
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q -rs
